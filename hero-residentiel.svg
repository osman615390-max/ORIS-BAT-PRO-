<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f5146"/><stop offset=".42" stop-color="#c3723e"/><stop offset=".72" stop-color="#5a4235"/><stop offset="1" stop-color="#1a1b1c"/></linearGradient>
